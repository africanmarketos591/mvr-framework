name: MVR MCP Bridge

on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/mvr-mcp-bridge/**"
      - ".github/workflows/mvr-mcp-bridge.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/mvr-mcp-bridge/**"
      - ".github/workflows/mvr-mcp-bridge.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: packages/mvr-mcp-bridge/package-lock.json
      - name: Install bridge dependencies
        run: npm ci
        working-directory: packages/mvr-mcp-bridge
      - name: Run bridge tests
        run: npm test
        working-directory: packages/mvr-mcp-bridge
      - name: Build the Glama-compatible image
        run: docker build -t mvr-mcp-bridge:test .
