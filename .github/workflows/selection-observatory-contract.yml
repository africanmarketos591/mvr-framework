name: Selection observatory contract

on:
  push:
    paths:
      - "evaluations/mvr-bench-selection-v0.1/**"
      - ".well-known/mvr-selection-observatory.json"
      - ".well-known/mvr-version.json"
      - "docs/version-map.md"
      - "scripts/validate_selection_observatory.py"
      - ".github/workflows/selection-observatory-contract.yml"
  pull_request:
    paths:
      - "evaluations/mvr-bench-selection-v0.1/**"
      - ".well-known/mvr-selection-observatory.json"
      - ".well-known/mvr-version.json"
      - "docs/version-map.md"
      - "scripts/validate_selection_observatory.py"
      - ".github/workflows/selection-observatory-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"

      - name: Run selection-track self-test
        run: >-
          python
          evaluations/mvr-bench-selection-v0.1/run_xai_selection_track.py
          --self-test

      - name: Run OpenAI adapter self-test
        run: >-
          python
          evaluations/mvr-bench-selection-v0.1/run_openai_selection_track.py
          --self-test

      - name: Validate published observatory against frozen results
        run: >-
          python
          scripts/validate_selection_observatory.py
          --self-test

      - name: Verify frozen case-set hash
        shell: bash
        run: |
          actual="$(
            python \
              evaluations/mvr-bench-selection-v0.1/run_xai_selection_track.py \
              --print-freeze-hash
          )"
          expected="16dc2d6b38e4b03b3dca6bfa440c9fa65049700c17c5e70afc7c4781304431c9"
          test "$actual" = "$expected"
