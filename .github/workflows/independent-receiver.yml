name: Independent receiver qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'conformance/receiver-kit/independent/**'
      - '.github/workflows/independent-receiver.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.11.0'
      - name: Verify a separate draft ledger against the live lab
        run: |
          node conformance/receiver-kit/independent/run.mjs receiver-result.json
          cat receiver-result.json
