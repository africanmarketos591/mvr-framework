name: Outcome Calibration Contract

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "docs/outcome-calibration-ledger.md"
      - "docs/outcome-first-cohort-operating-pack.md"
      - "evaluations/outcome-first-cohort-v1/protocol.json"
      - "scripts/validate_outcome_calibration_contract.py"
      - "scripts/validate_outcome_first_cohort.py"
      - ".github/workflows/outcome-calibration-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/outcome-calibration-ledger.md"
      - "docs/outcome-first-cohort-operating-pack.md"
      - "evaluations/outcome-first-cohort-v1/protocol.json"
      - "scripts/validate_outcome_calibration_contract.py"
      - "scripts/validate_outcome_first_cohort.py"
      - ".github/workflows/outcome-calibration-contract.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
      - name: Validate local outcome-calibration contract
        run: python scripts/validate_outcome_calibration_contract.py
      - name: Validate local first-cohort operating contract
        run: python scripts/validate_outcome_first_cohort.py
      - name: Validate production outcome-calibration contract
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/validate_outcome_calibration_contract.py --live
