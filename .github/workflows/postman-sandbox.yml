name: Postman Sandbox Smoke Test

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "postman/**"
      - "api/**"
      - "openapi.*"
      - ".github/workflows/postman-sandbox.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "postman/**"
      - "api/**"
      - "openapi.*"
      - ".github/workflows/postman-sandbox.yml"

jobs:
  newman:
    name: Run public sandbox collection
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.11.0"

      - name: Run Newman against MVR sandbox
        run: |
          npx --yes newman@6.2.1 run postman/mvr-core-v6.32.0.postman_collection.json \
            --env-var MVR_BASE_URL=https://africanmarketos.com \
            --env-var MVR_API_KEY=mvr-demo-key-2026 \
            --timeout-request 90000 \
            --bail
