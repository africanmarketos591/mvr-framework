name: Agent distribution sanity

on:
  push:
    paths:
      - "plugins/anthropic-mvr-preflight/**"
      - "integrations/openai/**"
      - "scripts/validate_agent_distribution.py"
      - ".github/workflows/agent-distribution-sanity.yml"
  pull_request:
    paths:
      - "plugins/anthropic-mvr-preflight/**"
      - "integrations/openai/**"
      - "scripts/validate_agent_distribution.py"
      - ".github/workflows/agent-distribution-sanity.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_agent_distribution.py
