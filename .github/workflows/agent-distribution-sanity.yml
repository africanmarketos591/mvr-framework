name: Agent distribution sanity

on:
  push:
    paths:
      - "plugins/anthropic-mvr-preflight/**"
      - "integrations/openai/**"
      - "scripts/validate_agent_distribution.py"
      - ".github/workflows/agent-distribution-sanity.yml"
  pull_request:
    paths:
      - "plugins/anthropic-mvr-preflight/**"
      - "integrations/openai/**"
      - "scripts/validate_agent_distribution.py"
      - ".github/workflows/agent-distribution-sanity.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
      - run: python scripts/validate_agent_distribution.py
