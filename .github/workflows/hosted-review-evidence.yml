name: Hosted review evidence
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'conformance/review-tools/**'
      - 'release-evidence/2026-10-24-hosted-review/**'
      - '.github/workflows/hosted-review-evidence.yml'
  pull_request:
    paths:
      - 'conformance/review-tools/**'
      - 'release-evidence/2026-10-24-hosted-review/**'
      - '.github/workflows/hosted-review-evidence.yml'
jobs:
  verify-hosted-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.11.0'
      - run: node release-evidence/2026-10-24-hosted-review/verify.mjs
