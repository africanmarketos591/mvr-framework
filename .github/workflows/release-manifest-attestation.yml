name: Release manifest attestation
# Each deployed AMOS release manifest is attested on main with a GitHub artifact attestation (Sigstore, OIDC workflow
# identity). Verify: gh attestation verify release-manifests/<revision>.json --repo africanmarketos591/mvr-framework
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'release-manifests/**'
      - '.github/workflows/release-manifest-attestation.yml'
  pull_request:
    paths:
      - 'release-manifests/**'
      - 'scripts/check-release-drift.mjs'
      - '.github/workflows/release-manifest-attestation.yml'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.11.0'
      - name: Every committed manifest is content-addressed
        run: node scripts/check-release-drift.mjs --offline
  attest:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-manifests/*.json'
