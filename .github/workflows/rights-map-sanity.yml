name: Rights map sanity

on:
  push:
    paths:
      - "LICENSE"
      - "RIGHTS-MAP.md"
      - "TRADEMARKS.md"
      - "NOTICE"
      - "CITATION.cff"
      - "README.md"
      - ".well-known/mvr-license.json"
      - "well-known/mvr-license.json"
      - "benchmarks/mvr-bench/**"
      - "packages/mvr-agent-sdk/**"
      - "packages/mvr-mcp-bridge/package.json"
      - "scripts/validate_rights_map.py"
      - ".github/workflows/rights-map-sanity.yml"
  pull_request:
    paths:
      - "LICENSE"
      - "RIGHTS-MAP.md"
      - "TRADEMARKS.md"
      - "NOTICE"
      - "CITATION.cff"
      - "README.md"
      - ".well-known/mvr-license.json"
      - "well-known/mvr-license.json"
      - "benchmarks/mvr-bench/**"
      - "packages/mvr-agent-sdk/**"
      - "packages/mvr-mcp-bridge/package.json"
      - "scripts/validate_rights_map.py"
      - ".github/workflows/rights-map-sanity.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
      - run: python scripts/validate_rights_map.py
