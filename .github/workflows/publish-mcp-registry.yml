name: Publish MVR API to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "mcp-v*"

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install MCP publisher
        run: |
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz"
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server manifest
        run: ./mcp-publisher publish server.json

      - name: Verify published Registry record and live MCP contract
        env:
          MVR_REQUIRE_REGISTRY_PUBLISHED: "1"
        run: node scripts/verify-mcp-registry-contract.mjs
