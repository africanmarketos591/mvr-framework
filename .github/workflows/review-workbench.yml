name: Local review workbench
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'examples/decision-review-workbench/**'
      - 'release-evidence/2026-10-24-review-workbench/**'
      - '.github/workflows/review-workbench.yml'
  pull_request:
    paths:
      - 'examples/decision-review-workbench/**'
      - 'release-evidence/2026-10-24-review-workbench/**'
      - '.github/workflows/review-workbench.yml'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.11.0'
      - run: node release-evidence/2026-10-24-review-workbench/verify.mjs
