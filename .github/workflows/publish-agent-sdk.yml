name: Publish MVR Agent SDK

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package target to publish
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - npm
          - pypi
          - all
  push:
    tags:
      - "mvr-agent-sdk-v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate SDK packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.11.0"

      - name: Validate npm package
        working-directory: packages/mvr-agent-sdk/npm
        run: |
          node --check src/index.js
          npm pack --dry-run

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"

      - name: Validate Python package
        working-directory: packages/mvr-agent-sdk/python
        run: |
          python -m pip install --only-binary=:all: "build==1.3.0" "twine==6.2.0"
          python -m py_compile mvr_agent_sdk/client.py mvr_agent_sdk/__init__.py
          python -m build
          python -m twine check dist/*

  publish-npm:
    name: Publish npm package
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    if: ${{ startsWith(github.ref, 'refs/tags/mvr-agent-sdk-v') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'npm' || inputs.target == 'all')) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.11.0"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.6.3

      - name: Configure npm token fallback when present
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "NPM_TOKEN not present; relying on npm trusted publishing/provenance if configured."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish npm package
        working-directory: packages/mvr-agent-sdk/npm
        run: npm publish --provenance --access public

  publish-pypi:
    name: Publish PyPI package
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    if: ${{ startsWith(github.ref, 'refs/tags/mvr-agent-sdk-v') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'pypi' || inputs.target == 'all')) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"

      - name: Build Python distributions
        working-directory: packages/mvr-agent-sdk/python
        run: |
          python -m pip install --only-binary=:all: "build==1.3.0"
          python -m build

      - name: Detect PyPI token fallback
        id: pypi_token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Python package to PyPI with token fallback
        if: ${{ steps.pypi_token.outputs.has_token == 'true' }}
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: packages/mvr-agent-sdk/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish Python package to PyPI with trusted publishing
        if: ${{ steps.pypi_token.outputs.has_token != 'true' }}
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: packages/mvr-agent-sdk/python/dist
